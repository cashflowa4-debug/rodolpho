<script>
'use strict';

/* =============================================================
   UTILITAIRES
============================================================= */
function $(id) { return document.getElementById(id); }

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Compression d'image en Base64 (max 800px, JPEG 0.75)
function compressImage(file, maxSize = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) { reject(new Error('Fichier non image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Lecture fichier échouée'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image invalide'));
      img.onload = () => {
        try {
          let { width, height } = img;
          if (width > maxSize || height > maxSize) {
            const ratio = Math.min(maxSize / width, maxSize / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Placeholder SVG (dégradé + initiale)
function placeholderImg(name) {
  const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ef4444', '#14b8a6'];
  const char = (name || '?').charAt(0).toUpperCase();
  const color = colors[(name || '?').charCodeAt(0) % colors.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="${color}aa"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="245" text-anchor="middle" font-family="sans-serif" font-size="150" fill="white" font-weight="600">${char}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function formatPrice(n) {
  const currency = (state && state.profile && state.profile.currency) || 'FCFA';
  const num = Number(n) || 0;
  const formatted = new Intl.NumberFormat('fr-FR').format(num);
  return `${formatted} ${currency}`;
}

// Deep merge (objets fusionnés, tableaux remplacés)
function mergeDeep(target, source) {
  const out = Array.isArray(target) ? [...target] : { ...target };
  for (const k in source) {
    if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])
        && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
      out[k] = mergeDeep(target[k], source[k]);
    } else {
      out[k] = source[k];
    }
  }
  return out;
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }
}

function uid() {
  return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

const SEVEN_DAYS = 7 * 24 * 3600 * 1000;
function isNewProduct(p) {
  return p && p.createdAt && (Date.now() - p.createdAt < SEVEN_DAYS);
}

/* =============================================================
   ÉTAT & PERSISTANCE
============================================================= */
const STORAGE_KEY  = 'minishop_data';
const FB_URL_KEY   = 'minishop_fb_url';
const CART_KEY     = 'minishop_cart';
const FAV_KEY      = 'minishop_favs';
const RECENT_KEY   = 'minishop_recent';
const LOCK_KEY     = 'minishop_lock';

const now = Date.now();
const DEFAULT_DATA = {

    logo: '',
    currency: 'FCFA',
    trust: [
      { icon: '⚡', text: 'Réponse rapide' },
      { icon: '🔒', text: 'Paiement à la livraison' },
      { icon: '📦', text: 'Livraison soignée' }
    ],
    promo: { text: '', code: '' }
  },
  products: [
    { id: 'p1', name: 'Sac en cuir naturel', category: 'Accessoires', price: 15000, description: 'Sac à main en cuir véritable, finitions main, bandoulière ajustable.', image: '', active: true, createdAt: now - 90 * 24 * 3600 * 1000 },
    { id: 'p2', name: 'Bracelet perlé doré', category: 'Bijoux', price: 8000, description: 'Bracelet artisanal en perles dorées et pierres naturelles.', image: '', active: true, createdAt: now - 60 * 24 * 3600 * 1000 },
    { id: 'p3', name: 'Bougie parfumée', category: 'Maison', price: 5000, description: 'Bougie de soja parfumée vanille et bois de santal, 40h de combustion.', image: '', active: true, createdAt: now - 30 * 24 * 3600 * 1000 },
    { id: 'p4', name: 'Carnet relié cuir', category: 'Papeterie', price: 12000, description: 'Carnet de notes A5 avec couverture en cuir, 100 pages.', image: '', active: false, createdAt: now - 15 * 24 * 3600 * 1000 }
  ],
  contacts: {
    whatsapp: { enabled: true,  value: '' },
    telegram: { enabled: false, value: '' },
    signal:   { enabled: false, value: '' },
    snapchat: { enabled: false, value: '' }
  },
  security: {
    passwordHash: '',
    pinEnabled: false,
    pinHash: ''
  }
};

let state = null;
let fbDb = null;
let currentTab = 'products';
let editingProductId = null;
let pendingProductImage = null;
let pendingLogoImage = null;
let activeCategory = '__all__';
let searchQuery = '';
let sortMode = 'relevance';
let showFavoritesOnly = false;
let logoClickTimes = [];
let loginStep = 'password';

// Panier (par visiteur)
let cart = {};
try { cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch (_) { cart = {}; }
function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (_) {}
}

// Favoris (par visiteur)
let favorites = [];
try { favorites = JSON.parse(localStorage.getItem(FAV_KEY) || '[]') || []; } catch (_) { favorites = []; }
function saveFavorites() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (_) {}
}

// Récemment consultés (par visiteur)
let recentlyViewed = [];
try { recentlyViewed = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]') || []; } catch (_) { recentlyViewed = []; }
function saveRecentlyViewed() {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentlyViewed)); } catch (_) {}
}

// Anti-brute-force (par navigateur)
let lock = { attempts: 0, until: 0 };
try { lock = JSON.parse(localStorage.getItem(LOCK_KEY) || '{}') || lock; } catch (_) { lock = { attempts: 0, until: 0 }; }
function saveLock() {
  try { localStorage.setItem(LOCK_KEY, JSON.stringify(lock)); } catch (_) {}
}

function loadLocalData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return mergeDeep(DEFAULT_DATA, JSON.parse(raw));
  } catch (_) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
  if (fbDb) {
    fbDb.ref('store').set(state).catch(e => console.error('[Firebase] write error', e));
  } else {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  }
}

/* =============================================================
   FIREBASE
============================================================= */
function getFirebaseUrl() {
  const hashMatch = location.hash.match(/[#&]fb=([^&]+)/);
  if (hashMatch) return decodeURIComponent(hashMatch[1]);
  return localStorage.getItem(FB_URL_KEY) || '';
}

async function connectFirebase(url) {
  if (typeof firebase === 'undefined') return false;
  try {
    if (firebase.apps.length) {
      await Promise.all(firebase.apps.map(a => a.delete().catch(() => {})));
    }
    firebase.initializeApp({ databaseURL: url });
    fbDb = firebase.database();

    const snap = await fbDb.ref('store').once('value');
    if (!snap.exists()) {
      await fbDb.ref('store').set(state);
    } else {
      state = mergeDeep(DEFAULT_DATA, snap.val());
      render();
    }

    fbDb.ref('store').on('value', s => {
      const data = s.val();
      if (data) {
        state = mergeDeep(DEFAULT_DATA, data);
        render();
      }
    });

    return true;
  } catch (e) {
    console.error('[Firebase] init error', e);
    fbDb = null;
    return false;
  }
}

/* =============================================================
   RENDU — HEADER / TRUST / PROMO
============================================================= */
function renderHeader() {
  const p = state.profile;

  $('shopName').textContent = p.name || 'Ma Boutique';
  $('shopBio').textContent = p.bio || '';

  const ann = $('announcement');
  if (p.announcement && p.announcement.trim()) {
    ann.textContent = p.announcement;
    ann.classList.remove('hidden');
  } else {
    ann.classList.add('hidden');
  }

  const promo = p.promo || {};
  const promoEl = $('promoBanner');
  if ((promo.text && promo.text.trim()) || (promo.code && promo.code.trim())) {
    let html = '';
    if (promo.text && promo.text.trim()) html += escapeHtml(promo.text);
    if (promo.code && promo.code.trim()) html += ` · Code : <strong>${escapeHtml(promo.code)}</strong>`;
    promoEl.innerHTML = html;
    promoEl.classList.remove('hidden');
  } else {
    promoEl.classList.add('hidden');
  }

  $('shopLogo').src = p.logo || placeholderImg(p.name || 'M');
}

function renderTrust() {
  const el = $('trustBlock');
  const items = (state.profile.trust || []).filter(t => t && t.text && t.text.trim());
  if (items.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = items.map(t => `
    <span class="inline-flex items-center gap-1 text-[11px] bg-white border border-gray-200 rounded-full px-3 py-1 text-gray-600">
      <span>${escapeHtml(t.icon || '•')}</span> ${escapeHtml(t.text)}
    </span>
  `).join('');
}

/* =============================================================
   RENDU — FILTRES & PRODUITS
============================================================= */
function getFilteredProducts() {
  let list = state.products.filter(p => p.active);

  if (activeCategory !== '__all__') list = list.filter(p => p.category === activeCategory);
  if (showFavoritesOnly) list = list.filter(p => favorites.includes(p.id));

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase().trim();
    list = list.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.description || '').toLowerCase().includes(q) ||
      (p.category || '').toLowerCase().includes(q)
    );
  }

  if (sortMode === 'price-asc') list.sort((a, b) => (a.price || 0) - (b.price || 0));
  else if (sortMode === 'price-desc') list.sort((a, b) => (b.price || 0) - (a.price || 0));
  else if (sortMode === 'newest') list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  return list;
}

function renderCategories() {
  const cats = [...new Set(state.products.filter(p => p.active).map(p => p.category).filter(Boolean))];
  const container = $('categories');
  if (cats.length === 0) { container.innerHTML = ''; return; }

  const btn = (val, label) => {
    const active = activeCategory === val;
    return `<button data-cat="${escapeHtml(val)}" class="cat-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition ${active ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'}">${escapeHtml(label)}</button>`;
  };

  container.innerHTML = btn('__all__', 'Tout') + cats.map(c => btn(c, c)).join('');

  container.querySelectorAll('.cat-btn').forEach(b => {
    b.addEventListener('click', () => {
      activeCategory = b.dataset.cat;
      renderCategories();
      renderProducts();
    });
  });
}

function productCardHtml(p) {
  const qty = cart[p.id] || 0;
  const img = p.image || placeholderImg(p.name);
  const fav = favorites.includes(p.id);
  const nouveau = isNewProduct(p);

  return `
    <article class="fade-in bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
      <div class="relative aspect-square bg-gray-100 cursor-pointer" data-view="${p.id}">
        <img src="${img}" alt="${escapeHtml(p.name)}" class="w-full h-full object-cover" loading="lazy">
        ${nouveau ? '<span class="absolute top-2 left-2 text-[10px] font-semibold bg-emerald-500 text-white px-2 py-0.5 rounded-full">Nouveau</span>' : ''}
        <button data-fav="${p.id}" class="absolute top-2 right-2 w-9 h-9 rounded-full bg-white/90 backdrop-blur flex items-center justify-center shadow" title="Favori" aria-label="Favori">
          <span class="text-lg ${fav ? 'text-red-500' : 'text-gray-400'}">${fav ? '♥' : '♡'}</span>
        </button>
      </div>
      <div class="p-4 flex flex-col flex-1">
        <span class="text-[11px] uppercase tracking-wide text-gray-400 font-medium">${escapeHtml(p.category || '')}</span>
        <h3 class="font-semibold text-sm mt-1 cursor-pointer" data-view="${p.id}">${escapeHtml(p.name)}</h3>
        <p class="text-xs text-gray-500 mt-1 line-clamp-2 flex-1">${escapeHtml(p.description || '')}</p>
        <div class="mt-3 flex items-center justify-between gap-2">
          <span class="font-semibold text-sm">${formatPrice(p.price)}</span>
          ${qty === 0
            ? `<button data-add="${p.id}" class="bg-gray-900 text-white text-xs font-medium px-3 py-2 rounded-lg active:scale-95 transition">Ajouter</button>`
            : `<div class="flex items-center gap-1 bg-gray-100 rounded-lg">
                 <button data-minus="${p.id}" class="w-8 h-8 text-gray-700 font-semibold" aria-label="Retirer">−</button>
                 <span class="w-6 text-center text-sm font-medium">${qty}</span>
                 <button data-plus="${p.id}" class="w-8 h-8 text-gray-700 font-semibold" aria-label="Ajouter">+</button>
               </div>`
          }
        </div>
      </div>
    </article>
  `;
}

function renderProducts() {
  const list = getFilteredProducts();
  const grid = $('productGrid');
  const empty = $('emptyState');

  if (list.length === 0) {
    grid.innerHTML = '';
    let msg = 'Aucun produit ne correspond à votre recherche.';
    if (showFavoritesOnly) msg = 'Aucun favori pour l\'instant. Ajoutez des ♥ sur vos produits préférés.';
    empty.textContent = msg;
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  grid.innerHTML = list.map(productCardHtml).join('');

  grid.querySelectorAll('[data-view]').forEach(el =>
    el.addEventListener('click', () => openProductModal(el.dataset.view)));

  grid.querySelectorAll('[data-fav]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); toggleFavorite(b.dataset.fav); }));

  grid.querySelectorAll('[data-add]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); addToCart(b.dataset.add, 1); }));
  grid.querySelectorAll('[data-plus]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); addToCart(b.dataset.plus, 1); }));
  grid.querySelectorAll('[data-minus]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); addToCart(b.dataset.minus, -1); }));
}

/* =============================================================
   RÉCEMMENT CONSULTÉS
============================================================= */
function recordViewed(id) {
  if (!id) return;
  recentlyViewed = [id, ...recentlyViewed.filter(x => x !== id)].slice(0, 12);
  saveRecentlyViewed();
  renderRecentlyViewed();
}

function renderRecentlyViewed() {
  const section = $('recentSection');
  const strip = $('recentStrip');
  const valid = recentlyViewed
    .map(id => state.products.find(p => p.id === id))
    .filter(p => p && p.active)

/* =============================================================
   PANIER
============================================================= */
function addToCart(id, delta) {
  const p = state.products.find(x => x.id === id);
  if (!p || !p.active) return;
  const cur = cart[id] || 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) delete cart[id];
  else cart[id] = next;
  saveCart();
  renderProducts();
  renderCartIndicator();
  renderCartItems();
  renderOrderButtons();
  renderCartPromo();
}

function renderCartIndicator() {
  const items = Object.entries(cart);
  const count = items.reduce((s, [, q]) => s + q, 0);
  const total = items.reduce((s, [id, q]) => {
    const p = state.products.find(x => x.id === id);
    return s + (p ? p.price * q : 0);
  }, 0);

  const btn = $('cartButton');
  if (count > 0) {
    btn.classList.remove('hidden');
    $('cartCount').textContent = count;
    $('cartTotalSmall').textContent = formatPrice(total);
  } else {
    btn.classList.add('hidden');
  }
  $('cartTotal').textContent = formatPrice(total);
}

function renderCartPromo() {
  const el = $('cartPromo');
  const promo = state.profile.promo || {};
  if ((promo.text && promo.text.trim()) || (promo.code && promo.code.trim())) {
    let html = '';
    if (promo.text && promo.text.trim()) html += escapeHtml(promo.text);
    if (promo.code && promo.code.trim()) html += ` · Code : <strong>${escapeHtml(promo.code)}</strong>`;
    el.innerHTML = '🎁 ' + html;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function renderCartItems() {
  const container = $('cartItems');
  // Nettoie les références orphelines
  for (const id of Object.keys(cart)) {
    if (!state.products.find(p => p.id === id)) delete cart[id];
  }
  saveCart();

  const items = Object.entries(cart);
  if (items.length === 0) {
    container.innerHTML = `<div class="text-center text-gray-500 text-sm py-12">Votre panier est vide.</div>`;
    return;
  }
  container.innerHTML = items.map(([id, qty]) => {
    const p = state.products.find(x => x.id === id);
    if (!p) return '';
    const img = p.image || placeholderImg(p.name);
    return `
      <div class="flex gap-3 items-center bg-gray-50 rounded-xl p-2">
        <img src="${img}" class="w-16 h-16 rounded-lg object-cover" alt="">
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate">${escapeHtml(p.name)}</div>
          <div class="text-xs text-gray-500">${formatPrice(p.price)}</div>
          <div class="flex items-center gap-1 mt-1 bg-white rounded-lg w-max border border-gray-200">
            <button data-cminus="${p.id}" class="w-7 h-7 text-gray-700">−</button>
            <span class="w-6 text-center text-xs font-medium">${qty}</span>
            <button data-cplus="${p.id}" class="w-7 h-7 text-gray-700">+</button>
          </div>
        </div>
        <button data-cdel="${p.id}" class="p-2 text-gray-400 hover:text-red-500" aria-label="Retirer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-cplus]').forEach(b =>
    b.addEventListener('click', () => addToCart(b.dataset.cplus, 1)));
  container.querySelectorAll('[data-cminus]').forEach(b =>
    b.addEventListener('click', () => addToCart(b.dataset.cminus, -1)));
  container.querySelectorAll('[data-cdel]').forEach(b =>
    b.addEventListener('click', () => {
      delete cart[b.dataset.cdel];
      saveCart();
      renderProducts();
      renderCartIndicator();
      renderCartItems();
      renderOrderButtons();
    }));
}

/* =============================================================
   COMMANDE
============================================================= */
function buildOrderText() {
  const orderNum = 'CMD-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  let text = `🛒 *Nouvelle commande* (${orderNum})\n\n`;
  let total = 0;
  for (const [id, qty] of Object.entries(cart)) {
    const p = state.products.find(x => x.id === id);
    if (!p) continue;
    const lineTotal = p.price * qty;
    total += lineTotal;
    text += `• ${p.name} ×${qty} — ${formatPrice(lineTotal)}\n`;
  }
  text += `\n*Total : ${formatPrice(total)}*\n`;
  const promo = state.profile.promo || {};
  if (promo.code && promo.code.trim()) text += `\nCode promo : *${promo.code.trim()}*\n`;
  if (promo.text && promo.text.trim()) text += `${promo.text.trim()}\n`;
  text += `\nMerci pour votre commande 🙏`;
  return text;
}

async function placeOrder(channel) {
  const c = state.contacts[channel];
  if (!c || !c.enabled || !c.value.trim()) return;

  const text = buildOrderText();
  const copied = await copyText(text);
  toast(copied
    ? '✅ Récapitulatif copié ! Collez-le dans la discussion'
    : 'Récapitulatif prêt, collez-le manuellement');

  setTimeout(() => {
    const val = c.value.trim().replace(/^@/, '');
    let url = '';
    if (channel === 'whatsapp') {
      url = `https://wa.me/${val.replace(/[^\d]/g, '')}?text=${encodeURIComponent(text)}`;
    } else if (channel === 'telegram') {
      url = `https://t.me/${val}?text=${encodeURIComponent(text)}`;
    } else if (channel === 'signal') {
      url = val.startsWith('http') ? val : `https://signal.me/#p/${val}`;
    } else if (channel === 'snapchat') {
      url = `https://www.snapchat.com/add/${val}`;
    }
    if (url) window.open(url, '_blank');
  }, 400);
}

function renderOrderButtons() {
  const container = $('orderButtons');
  const channels = [
    { key: 'whatsapp', label: 'WhatsApp', cls: 'bg-[#25D366] hover:bg-[#1ebe5a]', icon: '💬' },
    { key: 'telegram', label: 'Telegram', cls: 'bg-[#229ED9] hover:bg-[#1d8cbf]', icon: '✈️' },
    { key: 'signal',   label: 'Signal',   cls: 'bg-[#3A76F0] hover:bg-[#2f66d4]', icon: '🔒' },
    { key: 'snapchat', label: 'Snapchat', cls: 'bg-[#FFFC00] text-gray-900 hover:bg-[#e6e300]', icon: '👻' }
  ];
  const active = channels.filter(c => state.contacts[c.key]?.enabled && (state.contacts[c.key]?.value || '').trim());

  if (Object.keys(cart).length === 0) {
    container.innerHTML = `<p class="text-center text-xs text-gray-500">Ajoutez des produits pour commander.</p>`;
    return;
  }
  if (active.length === 0) {
    container.innerHTML = `<p class="text-center text-xs text-gray-500">Aucun canal de commande disponible.</p>`;
    return;
  }

  container.innerHTML = active.map(c => `
    <button data-order="${c.key}" class="${c.cls} text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 w-full text-sm active:scale-[0.99] transition">
      <span>${c.icon}</span> Commander via ${c.label}
    </button>
  `).join('');

  container.querySelectorAll('[data-order]').forEach(b =>
    b.addEventListener('click', () => placeOrder(b.dataset.order)));
}

async function shareShop() {

  const data = { title: state.profile.name || 'Ma Boutique', text: state.profile.bio || 'Découvrez ma boutique', url };

/* =============================================================
   ADMIN — CONNEXION (MDP + PIN + ANTI-BRUTE-FORCE)
============================================================= */
function triggerLogoClick() {
  const now = Date.now();
  logoClickTimes = logoClickTimes.filter(t => now - t < 2000);
  logoClickTimes.push(now);
  if (logoClickTimes.length >= 5) {
    logoClickTimes = [];
    openAdminLogin();
  }
}

function openAdminLogin() {
  loginStep = 'password';
  renderLoginStep();
  $('loginError').textContent = '';
  $('adminLoginModal').classList.remove('hidden');
  $('adminLoginModal').classList.add('flex');
  setTimeout(() => $('adminPassword').focus(), 100);
}

function closeAdminLogin() {
  $('adminLoginModal').classList.add('hidden');
  $('adminLoginModal').classList.remove('flex');
  loginStep = 'password';
  $('adminPassword').value = '';
  $('loginError').textContent = '';
}

function renderLoginStep() {
  const inp = $('adminPassword');
  const label = $('loginStepLabel');
  if (loginStep === 'pin') {
    inp.type = 'password';
    inp.placeholder = 'Code PIN';
    inp.setAttribute('inputmode', 'numeric');
    label.textContent = 'Étape 2/2 : code PIN';
    label.classList.remove('hidden');
  } else {
    inp.type = 'password';
    inp.placeholder = 'Mot de passe';
    inp.removeAttribute('inputmode');
    label.classList.add('hidden');
  }
  inp.value = '';
  if (loginStep === 'pin') setTimeout(() => inp.focus(), 50);
}

function registerFailedAttempt() {
  lock.attempts = (lock.attempts || 0) + 1;
  if (lock.attempts >= 5) {
    lock.until = Date.now() + 60000;
    $('loginError').textContent = 'Trop de tentatives. Compte verrouillé 60s.';
  } else {
    $('loginError').textContent = `Mot de passe incorrect. (${lock.attempts}/5)`;
  }
  saveLock();
}

async function tryAdminLogin() {
  if (lock.until > Date.now()) {
    const remaining = Math.ceil((lock.until - Date.now()) / 1000);
    $('loginError').textContent = `Verrouillé. Réessayez dans ${remaining}s.`;
    return;
  }

  const pw = $('adminPassword').value;
  if (!pw) { $('loginError').textContent = loginStep === 'pin' ? 'PIN requis.' : 'Mot de passe requis.'; return; }

  const hash = await sha256(pw);

  if (loginStep === 'password') {
    let ok = false;
    if (!state.security.passwordHash) {
      if (pw === 'admin1234') {
        state.security.passwordHash = hash;
        saveData();
        ok = true;
      }
    } else {
      ok = hash === state.security.passwordHash;
    }
    if (!ok) { registerFailedAttempt(); return; }

    // Réinitialise le lock
    lock.attempts = 0;
    lock.until = 0;
    saveLock();

    // Second facteur éventuel
    if (state.security.pinEnabled && state.security.pinHash) {
      loginStep = 'pin';
      renderLoginStep();
      $('loginError').textContent = '';
      return;
    }

    closeAdminLogin();
    openAdmin();
  } else if (loginStep === 'pin') {
    if (hash !== state.security.pinHash) { registerFailedAttempt(); return; }
    lock.attempts = 0;
    lock.until = 0;
    saveLock();
    closeAdminLogin();
    openAdmin();
  }
}

        <input id="fCat" type="text" placeholder="Catégorie" value="${escapeHtml(p.category || '')}"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <input id="fPrice" type="number" step="any" placeholder="Prix" value="${p.price}"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
      </div>
      <textarea id="fDesc" placeholder="Description" rows="3"

      <label class="flex items-center gap-2 text-sm">

        <button id="saveProductBtn" class="flex-1 py-3 rounded-xl bg-gray-900 text-white text-sm font-medium">Enregistrer</button>
      </div>
    </div>
  `;
}

/* ---------- SÉCURITÉ ---------- */
function renderSecurityTab() {
  const fbConnected = !!fbDb;
  const fbUrl = localStorage.getItem(FB_URL_KEY) || '';
  const shareLink = fbUrl ? (location.origin + location.pathname + '#fb=' + encodeURIComponent(fbUrl)) : '';
  const pinEnabled = !!state.security.pinEnabled;
  const locked = lock.until > Date.now();

  return `
    <div class="space-y-4">

      <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3">
        <h2 class="font-semibold text-sm">Changer le mot de passe</h2>
        <input id="newPw" type="password" placeholder="Nouveau mot de passe" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <input id="newPw2" type="password" placeholder="Confirmer le mot de passe" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <button id="changePwBtn" class="w-full py-3 rounded-xl bg-gray-900 text-white text-sm font-medium">Mettre à jour</button>
        <p id="pwMsg" class="text-xs h-4"></p>
      </div>

      <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3">
        <h2 class="font-semibold text-sm">Double sécurité (PIN)</h2>
        <p class="text-xs text-gray-500">Ajoutez un code PIN en plus du mot de passe pour renforcer l'accès admin.</p>
        <label class="flex items-center gap-2 text-sm">
          <input id="pinEnabled" type="checkbox" ${pinEnabled ? 'checked' : ''} class="w-4 h-4">
          <span>Exiger un code PIN en plus du mot de passe</span>
        </label>
        <input id="pinInput" type="text" inputmode="numeric" maxlength="6" placeholder="PIN (4 à 6 chiffres)"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <button id="savePinBtn" class="w-full py-3 rounded-xl bg-gray-900 text-white text-sm font-medium">Enregistrer le PIN</button>
        <p class="text-xs ${pinEnabled ? 'text-green-600' : 'text-gray-500'}">${pinEnabled ? '✓ Protection renforcée active' : 'Protection standard (mot de passe seul)'}</p>
      </div>

      <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3">
        <h2 class="font-semibold text-sm">État de sécurité</h2>
        <p class="text-xs">Tentatives échouées : <strong>${lock.attempts || 0}</strong></p>
        ${locked
          ? `<p class="text-xs text-red-600">Verrouillé jusqu'à ${new Date(lock.until).toLocaleTimeString()}</p>`
          : '<p class="text-xs text-green-600">Accès disponible</p>'}
        <button id="resetLockBtn" class="w-full py-2 rounded-lg bg-gray-100 text-xs font-medium">Réinitialiser le verrouillage</button>
      </div>

      <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3">
        <h2 class="font-semibold text-sm">Synchronisation Firebase</h2>
        <p class="text-xs text-gray-500">Collez l'URL de votre base Realtime Database pour synchroniser vos données en direct avec tous vos visiteurs.</p>
        <p class="text-xs">Statut : ${fbConnected ? '<span class="text-green-600 font-medium">● Connecté</span>' : '<span class="text-gray-400">● Non connecté (mode local)</span>'}</p>
        <input id="fbUrlInput" type="text" placeholder="https://xxx-default-rtdb.firebaseio.com" value="${escapeHtml(fbUrl)}"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <div class="flex gap-2">
          <button id="fbConnectBtn" class="flex-1 py-3 rounded-xl bg-gray-900 text-white text-sm font-medium">Connecter</button>
          <button id="fbDisconnectBtn" class="flex-1 py-3 rounded-xl bg-gray-100 text-sm font-medium">Déconnecter</button>
        </div>
        ${shareLink ? `
          <div class="pt-2 border-t">
            <label class="block text-xs text-gray-500 mb-1">Lien de partage (à donner à vos visiteurs)</label>
            <input type="text" readonly value="${escapeHtml(shareLink)}" id="shareLinkInput"
              class="w-full px-3 py-2 rounded-lg border border-gray-200 text-xs bg-gray-50">
            <button id="copyShareBtn" class="mt-2 w-full py-2 rounded-lg bg-gray-100 text-xs font-medium">Copier le lien</button>
          </div>
        ` : ''}
      </div>

      <div class="bg-white rounded-2xl p-4 border border-gray-100 space-y-3">
        <h2 class="font-semibold text-sm">Sauvegarde</h2>
        <div class="flex gap-2">
          <button id="exportBtn" class="flex-1 py-3 rounded-xl bg-gray-100 text-sm font-medium">Exporter JSON</button>
          <label class="flex-1 py-3 rounded-xl bg-gray-100 text-sm font-medium text-center cursor-pointer">
            Importer JSON
            <input id="importFile" type="file" accept="application/json" class="hidden">
          </label>
        </div>
        <p class="text-[11px] text-gray-500">L'importation remplace toutes les données actuelles.</p>
      </div>
    </div>
  `;
}

/* =============================================================
   ADMIN — ÉVÉNEMENTS
============================================================= */
function bindAdminEvents() {
  // ---- Produits ----
  const addBtn = $('addProductBtn');
  if (addBtn) addBtn.addEventListener('click', () => {
    editingProductId = 'new';
    pendingProductImage = null;
    renderAdminContent();
  });

  document.querySelectorAll('[data-edit]').forEach(b =>
    b.addEventListener('click', () => {
      editingProductId = b.dataset.edit;
      pendingProductImage = null;
      renderAdminContent();
    }));

  document.querySelectorAll('[data-dup]').forEach(b =>
    b.addEventListener('click', () => {
      const src = state.products.find(x => x.id === b.dataset.dup);
      if (!src) return;
      state.products.push({ ...src, id: uid(), name: src.name + ' (copie)', createdAt: Date.now() });
      saveData(); render(); renderAdminContent();
    }));

  document.querySelectorAll('[data-toggle]').forEach(b =>
    b.addEventListener('click', () => {
      const p = state.products.find(x => x.id === b.dataset.toggle);
      if (!p) return;
      p.active = !p.active;
      saveData(); render(); renderAdminContent();
    }));

  document.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => {
      if (!confirm('Supprimer ce produit ?')) return;
      const id = b.dataset.del;
      state.products = state.products.filter(x => x.id !== id);
      delete cart[id];
      favorites = favorites.filter(x => x !== id);
      recentlyViewed = recentlyViewed.filter(x => x !== id);
      saveCart(); saveFavorites(); saveRecentlyViewed();
      saveData(); render(); renderAdminContent();
    }));

  // ---- Formulaire produit ----
  const pvFile = $('pvFile');
  if (pvFile) {
    pvFile.addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        pendingProductImage = await compressImage(f);
        $('pvImg').src = pendingProductImage;
      } catch (err) { alert('Impossible de traiter cette image.'); }
    });
  }

  const cancelBtn = $('cancelProductBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    editingProductId = null;
    pendingProductImage = null;
    renderAdminContent();
  });

  const saveBtn = $('saveProductBtn');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const name = $('fName').value.trim();
    const category = $('fCat').value.trim();
    const price = Number($('fPrice').value);
    const description = $('fDesc').value.trim();
    const active = $('fActive').checked;

    if (!name) { alert('Le nom est requis.'); return; }
    if (isNaN(price) || price < 0) { alert('Prix invalide.'); return; }

    if (editingProductId === 'new') {
      state.products.push({
        id: uid(), name, category, price, description,
        image: pendingProductImage || '', active, createdAt: Date.now()
      });
    } else {
      const p = state.products.find(x => x.id === editingProductId);
      if (p) {
        p.name = name; p.category = category; p.price = price;
        p.description = description; p.active = active;
        if (pendingProductImage) p.image = pendingProductImage;
      }
    }
    editingProductId = null;
    pendingProductImage = null;
    saveData(); render(); renderAdminContent();
  });

  // ---- Profil ----
  const logoFile = $('logoFile');
  if (logoFile) {
    logoFile.addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        pendingLogoImage = await compressImage(f);
        $('pvLogo').src = pendingLogoImage;
      } catch (err) { alert('Impossible de traiter cette image.'); }
    });
  }

  const saveProfile = $('saveProfileBtn');
  if (saveProfile) saveProfile.addEventListener('click', () => {
    state.profile.name = $('pName').value.trim() || 'Ma Boutique';
    state.profile.bio = $('pBio').value.trim();
    state.profile.announcement = $('pAnn').value.trim();
    state.profile.currency = $('pCurrency').value;

    // Trust
    state.profile.trust = [0,1,2].map(i => {
      const icon = (document.querySelector(`[data-trust-icon="${i}"]`)?.value || '').trim();
      const text = (document.querySelector(`[data-trust-text="${i}"]`)?.value || '').trim();
      return { icon, text };
    }).filter(t => t.text);

    // Promo
    state.profile.promo = {
      text: ($('pPromoText')?.value || '').trim(),
      code: ($('pPromoCode')?.value || '').trim()
    };

    if (pendingLogoImage) { state.profile.logo = pendingLogoImage; pendingLogoImage = null; }

    saveData(); render(); renderAdminContent();
    toast('Profil enregistré ✅');
  });

  // ---- Contacts ----
  const saveContacts = $('saveContactsBtn');
  if (saveContacts) saveContacts.addEventListener('click', () => {
    ['whatsapp', 'telegram', 'signal', 'snapchat'].forEach(k => {
      const valInput = document.querySelector(`[data-val="${k}"]`);
      const tgInput = document.querySelector(`[data-tg="${k}"]`);
      if (valInput) state.contacts[k].value = valInput.value.trim();
      if (tgInput) state.contacts[k].enabled = tgInput.checked;
    });
    saveData(); render(); renderAdminContent();
    toast('Contacts enregistrés ✅');
  });

  // ---- Sécurité ----
  const changePw = $('changePwBtn');
  if (changePw) changePw.addEventListener('click', async () => {
    const a = $('newPw').value, b = $('newPw2').value;
    const msg = $('pwMsg');
    msg.className = 'text-xs h-4';
    if (!a || a.length < 4) { msg.textContent = 'Minimum 4 caractères.'; msg.classList.add('text-red-500'); return; }
    if (a !== b) { msg.textContent = 'Les mots de passe ne correspondent pas.'; msg.classList.add('text-red-500'); return; }
    state.security.passwordHash = await sha256(a);
    saveData();
    msg.textContent = 'Mot de passe mis à jour ✅';
    msg.classList.add('text-green-600');
  });

  const savePinBtn = $('savePinBtn');
  if (savePinBtn) savePinBtn.addEventListener('click', async () => {
    const enabled = $('pinEnabled').checked;
    const pin = $('pinInput').value.trim();
    if (enabled) {
      if (!/^\d{4,6}$/.test(pin)) { alert('Le PIN doit contenir 4 à 6 chiffres.'); return; }
      state.security.pinEnabled = true;
      state.security.pinHash = await sha256(pin);
    } else {
      state.security.pinEnabled = false;
      state.security.pinHash = '';
    }
    saveData();
    toast('Paramètres PIN enregistrés ✅');
    renderAdminContent();
  });

  const resetLock = $('resetLockBtn');
  if (resetLock) resetLock.addEventListener('click', () => {
    lock.attempts = 0;
    lock.until = 0;
    saveLock();
    toast('Verrouillage réinitialisé ✅');
    renderAdminContent();
  });

  // ---- Firebase ----
  const fbConnect = $('fbConnectBtn');
  if (fbConnect) fbConnect.addEventListener('click', async () => {
    const url = $('fbUrlInput').value.trim();
    if (!url) { alert('Collez une URL Firebase.'); return; }
    localStorage.setItem(FB_URL_KEY, url);
    const ok = await connectFirebase(url);
    if (ok) {
      toast('Synchronisation Firebase activée ✅');
      render();
      renderAdminContent();
    } else {
      alert('Échec de connexion. Vérifiez l\'URL et les règles de la base.');
    }
  });

  const fbDisconnect = $('fbDisconnectBtn');
  if (fbDisconnect) fbDisconnect.addEventListener('click', async () => {
    localStorage.removeItem(FB_URL_KEY);
    try {
      if (fbDb) fbDb.ref('store').off();
      if (firebase.apps.length) {
        await Promise.all(firebase.apps.map(a => a.delete().catch(() => {})));
      }
    } catch (_) {}
    fbDb = null;
    toast('Déconnecté. Mode local activé.');
    renderAdminContent();
  });

  const copyShare = $('copyShareBtn');
  if (copyShare) copyShare.addEventListener('click', async () => {
    const v = $('shareLinkInput').value;
    const ok = await copyText(v);
    toast(ok ? 'Lien copié ✅' : 'Copie impossible');
  });

  // ---- Sauvegarde ----
  const exportBtn = $('exportBtn');
  if (exportBtn) exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sauvegarde-boutique-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  });

  const importFile = $('importFile');
  if (importFile) importFile.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!confirm('Remplacer toutes les données actuelles ?')) return;
        state = mergeDeep(DEFAULT_DATA, data);
        saveData();
        render();
        renderAdminContent();
        toast('Données importées ✅');
      } catch (_) { alert('Fichier JSON invalide.'); }
    };
    reader.readAsText(f);
  });
}

/* =============================================================
   RENDU GLOBAL
============================================================= */
function render() {
  renderHeader();
  renderTrust();
  renderCategories();
  renderProducts();
  renderRecentlyViewed();
  renderCartIndicator();
  renderCartItems();
  renderCartPromo();
  renderOrderButtons();
  if (!$('adminPanel').classList.contains('hidden')) renderAdminContent();
}

/* =============================================================
   PANIER — Ouverture / Fermeture
============================================================= */
function openCart() {
  renderCartItems();
  renderCartPromo();
  renderOrderButtons();
  renderCartIndicator();
  const d = $('cartDrawer');
  d.classList.remove('translate-x-full');
  d.classList.add('translate-x-0');
  $('cartOverlay').classList.remove('hidden');
}
function closeCart() {
  const d = $('cartDrawer');
  d.classList.add('translate-x-full');
  d.classList.remove('translate-x-0');
  $('cartOverlay').classList.add('hidden');
}

/* =============================================================
   INITIALISATION
============================================================= */
async function init() {
  state = loadLocalData();

  const fbUrl = getFirebaseUrl();
  if (fbUrl) {
    if (!localStorage.getItem(FB_URL_KEY)) localStorage.setItem(FB_URL_KEY, fbUrl);
    await connectFirebase(fbUrl);
  } else {
    render();
  }

  // Recherche
  $('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderProducts();
  });

  // Tri
  $('sortSelect').addEventListener('change', e => {
    sortMode = e.target.value;
    renderProducts();
  });

  // Filtre favoris
  $('favFilterBtn').addEventListener('click', () => {
    showFavoritesOnly = !showFavoritesOnly;
    const btn = $('favFilterBtn');
    if (showFavoritesOnly) {
      btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
      btn.classList.add('bg-red-500', 'text-white', 'border-red-500');
    } else {
      btn.classList.remove('bg-red-500', 'text-white', 'border-red-500');
      btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
    }
    renderProducts();
  });

  // Partage
  $('shareBtn').addEventListener('click', shareShop);

  // Panier
  $('cartButton').addEventListener('click', openCart);
  $('cartOverlay').addEventListener('click', closeCart);
  $('closeCartBtn').addEventListener('click', closeCart);

  // Modal produit
  $('pmClose').addEventListener('click', closeProductModal);
  $('pmFav').addEventListener('click', () => { if (pmProductId) toggleFavorite(pmProductId); });
  $('pmMinus').addEventListener('click', () => {
    pmQty = Math.max(1, pmQty - 1);
    $('pmQty').textContent = pmQty;
  });
  $('pmPlus').addEventListener('click', () => {
    pmQty = Math.min(99, pmQty + 1);
    $('pmQty').textContent = pmQty;
  });
  $('pmAdd').addEventListener('click', () => {
    if (!pmProductId) return;
    addToCart(pmProductId, pmQty);
    closeProductModal();
    toast('Ajouté au panier ✅');
  });
  $('productModal').addEventListener('click', e => {
    if (e.target.id === 'productModal') closeProductModal();
  });

  // Trigger secret (5 taps < 2s sur logo)
  $('shopLogo').addEventListener('click', triggerLogoClick);

  // Trigger #admin
  if (location.hash.includes('admin')) setTimeout(openAdminLogin, 200);

  // Login admin
  $('adminLoginBtn').addEventListener('click', tryAdminLogin);
  $('adminPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryAdminLogin();
  });
  $('adminLoginCancelBtn').addEventListener('click', closeAdminLogin);
  $('adminLoginModal').addEventListener('click', e => {
    if (e.target.id === 'adminLoginModal') closeAdminLogin();
  });

  // Échap : fermeture propre
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('productModal').classList.contains('hidden')) closeProductModal();
    else if ($('cartOverlay').classList.contains('hidden') === false) closeCart();
    else if (!$('adminLoginModal').classList.contains('hidden')) closeAdminLogin();
  });

  // Rendu initial
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
